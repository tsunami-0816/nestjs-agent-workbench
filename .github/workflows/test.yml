name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  pytest-collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml requests
      - name: Collect-only (语法+用例收集检查，不连真实服务)
        run: |
          cd 08_测试/qa-automation
          python -m pytest --collect-only -q
